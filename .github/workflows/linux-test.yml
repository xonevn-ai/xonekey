name: Linux Engine Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y g++ make

    - name: Build engine
      working-directory: Sources/XoneKey/engine
      run: make

    - name: Run engine tests
      working-directory: Sources/XoneKey/engine
      run: ./test_engine
