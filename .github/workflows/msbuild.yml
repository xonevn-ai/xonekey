name: MSBuild

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: Sources/XoneKey/win32/XoneKey/XoneKey.sln

  # Configuration type to build.
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build x86
      run: msbuild -m -target:Rebuild -p:Configuration=Release -p:Platform=x86 ${{env.SOLUTION_FILE_PATH}}

    - name: Build x64
      run: msbuild -m -target:Rebuild -p:Configuration=Release -p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

    - name: Extract Version Name
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

    - name: Package Artifacts
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        $ReleaseDir = "Sources/XoneKey/win32/XoneKey/Release"
        $x64ReleaseDir = "Sources/XoneKey/win32/XoneKey/x64/Release"
        $ZipPath = "XoneKey-${{ env.RELEASE_VERSION }}.zip"
        
        # Create structured output
        New-Item -ItemType Directory -Path "dist/x86" -Force
        New-Item -ItemType Directory -Path "dist/x64" -Force
        
        if (Test-Path "$ReleaseDir/XoneKey.exe") {
            Copy-Item -Path "$ReleaseDir/XoneKey.exe" -Destination "dist/x86/"
            Copy-Item -Path "$ReleaseDir/XoneKeyUpdate.exe" -Destination "dist/x86/"
        }
        if (Test-Path "$x64ReleaseDir/XoneKey.exe") {
            Copy-Item -Path "$x64ReleaseDir/XoneKey.exe" -Destination "dist/x64/"
            Copy-Item -Path "$x64ReleaseDir/XoneKeyUpdate.exe" -Destination "dist/x64/"
        }
        
        Compress-Archive -Path "dist/*" -DestinationPath $ZipPath

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: XoneKey-*.zip
        draft: true
        prerelease: false
        generate_release_notes: true

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XoneKey-Build
        path: |
          Sources/XoneKey/win32/XoneKey/Release/
          Sources/XoneKey/win32/XoneKey/x64/Release/
